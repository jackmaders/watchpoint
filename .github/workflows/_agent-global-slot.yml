# Reusable workflow that computes which global TPM throttle slot a ticket
# belongs to. At most 2 AI agent jobs run repo-wide at once — one per slot.
# Caller workflows reference the output via `needs.slot.outputs.group`.
name: _Agent Global Slot

on:
  workflow_call:
    inputs:
      number:
        description: Issue or PR number to compute the slot for
        required: true
        type: number
    outputs:
      group:
        description: Concurrency group name for the global TPM throttle
        value: ${{ jobs.compute.outputs.group }}

jobs:
  compute:
    runs-on: ubuntu-latest
    outputs:
      group: ${{ steps.calc.outputs.group }}
    steps:
      - id: calc
        run: echo "group=agent-global-$(( ${{ inputs.number }} % 2 ))" >> "$GITHUB_OUTPUT"
