name: Agent Tickets

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-mutate-${{ github.event.issue.number }}
  cancel-in-progress: false
  # See agent-dispatch.yml — this group is shared across all agent-mutate-*
  # workflows so mutations on the same issue serialize. Without `queue: max`,
  # GH keeps only one pending run per group and cancels older pending ones,
  # so the run whose job `if` actually matches this event isn't guaranteed
  # to survive the race against the other workflows sharing the group.
  queue: max

jobs:
  slot:
    uses: ./.github/workflows/_agent-global-slot.yml
    with:
      number: ${{ github.event.issue.number }}

  tickets:
    needs: [slot]
    name: 🎫 Propose or wire tickets
    # Two ways in: the trigger label runs the proposal (no issues created
    # yet), or a comment while tickets:proposed is present runs tickets.ts
    # again with COMMENT_BODY set — tickets.ts itself checks that comment for
    # /approve before wiring anything (unlike agent-grill.yml, any comment
    # here is NOT treated as an answer; wiring is too consequential to fire on
    # every reply). Comments carrying the bot marker are filtered here too —
    # the AGENT_PAT used to chain this workflow makes its own comments look
    # human-authored (spec §5.8).
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'tickets:needed') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'tickets:proposed') &&
       !contains(github.event.comment.body, '<!-- bot-comment -->'))
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.slot.outputs.group }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: 🤖 Setup Codex
        uses: ./.github/actions/setup-codex
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}

      - name: 🎫 Propose or wire tickets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.6-luna' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          # GitHub-hosted runners are already isolated; avoid Codex's nested bwrap sandbox.
          AGENT_CODEX_BYPASS_SANDBOX: "1"
          AGENT_RUN_TIMEOUT_MS: "720000"
          # `AGENT_PAT` is what lets tickets.ts label the frontier dev:needed
          # — a label applied with the default GITHUB_TOKEN above cannot fire
          # agent-implement.yml (spec §5.8). tickets.ts itself falls back to a
          # comment listing the frontier when this secret isn't configured.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          # Only set on the issue_comment trigger — its presence is exactly
          # how tickets.ts tells the two entry points apart (scripts/agents/tickets.ts).
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun scripts/agents/tickets.ts

      # tickets.ts handles its own agent:blocked labeling and error comment on
      # a classified failure (matching grill.ts's pattern) and always removes
      # agent:in-progress itself in a `finally`. This step is only a backstop
      # for the run's Bun process dying outright — OOM, a runner timeout —
      # before that cleanup code ever gets to run.
      - name: 🧹 Remove agent:in-progress (backstop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "agent:in-progress" || true
