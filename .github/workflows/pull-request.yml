name: PR Quality Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  storybook-a11y:
    name: ♿ Run Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🌐 Install Playwright Chromium with OS Dependencies
        run: bunx playwright install --with-deps chromium

      - name: 🧭 Check shared UI story completeness
        run: bun run storybook:check:completeness

      - name: 🏗️ Build Storybook
        run: bun run storybook:build

      - name: ♿ Run browser accessibility checks
        run: bun run storybook:check:browser

      - name: 📩 Upload Storybook accessibility artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: storybook-a11y-artifacts
          path: |
            storybook-static/
            test-results/
            playwright-report/
          retention-days: 14

  e2e-tests:
    name: 🎭 Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🌐 Install Playwright Browsers with OS Dependencies
        run: bunx playwright install --with-deps chromium firefox

      - name: 🗄️ Run D1 Local Migrations
        run: bun run db:migrate:local

      - name: 🌱 Seed D1 Local Database
        run: bun run check:seed

      - name: 🧪 Run E2E Tests
        run: bun run test:e2e

      - name: 📩 Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: ✨ Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🚨 Verify Drizzle Migrations Sync
        run: bun run check:drizzle-sync

      - name: 🚨 Verify Cloudflare Types
        run: bun run check:cf-sync

      - name: 🧭 Verify Route Inventory Exhaustiveness
        run: bun run check:routes

      - name: 🦺 Check Type Safety
        run: bun run check:types

      - name: 📐 Check FSD Architecture
        run: bun run check:architecture

      - name: ✨ Check Linting and Formatting
        run: bun run check:all

  perf-budgets:
    name: ⚡ Enforce Performance Budgets & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🌐 Install Playwright Chromium with OS Dependencies
        run: bunx playwright install --with-deps chromium

      - name: 🗄️ Run D1 Local Migrations
        run: bun run db:migrate:local

      - name: 🌱 Seed D1 Local Database
        run: bun run check:seed

      - name: 🏗️ Build TanStack Start Application
        run: bun run build

      - name: 🚀 Validate Cloudflare Worker Deployment Artifacts
        run: bun run deploy --dry-run

      - name: 🛈 Check Cloudflare Worker Bundle Size Limits
        run: bun run check:bundle-size

      - name: 🚀 Start Production Preview Server
        run: |
          bun run preview --host 0.0.0.0 --port 3000 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Preview server is ready on port 3000"
              break
            fi
            sleep 1
          done

      - name: ⏱️ Run Performance Budget Audit Suite
        env:
          BASE_URL: "http://127.0.0.1:3000"
        run: bun run check:perf-budgets

  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🧪 Run Unit Tests with Coverage
        run: bun run test:coverage
