name: PR Quality Checks

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  e2e-tests:
    name: 🎭 Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 💾 Restore Playwright Browsers Cache
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright Browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: 🗄️ Run D1 Local Migrations
        run: bun run db:migrate:local

      - name: 🌱 Seed D1 Local Database
        run: bun run check:seed

      - name: 🧪 Run E2E Tests
        run: bun run test:e2e

      - name: 📩 Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: ✨ Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🚨 Verify Drizzle Migrations Sync
        run: bun run check:drizzle-sync

      - name: 🚨 Verify Cloudflare Types
        run: bun run check:cf-sync

      - name: 🦺 Check Type Safety
        run: bun run check:types

      - name: 📐 Check FSD Architecture
        run: bun run check:architecture

      - name: ✨ Check Linting and Formatting
        run: bun run check:all

  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🧪 Run Unit Tests with Coverage
        run: bun run test:coverage

  database:
    name: 🛢 Check Database Schema
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🗄️ Verify Cloudflare D1 Migrations
        run: bun run db:migrate:local

      - name: 🌱 Run Seed Script Check
        run: bun run check:seed

  build:
    name: 🏗️ Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: ./.github/actions/setup-bun

      - name: 🗄️ Run D1 Local Migrations
        run: bun run db:migrate:local

      - name: 🌱 Seed D1 Local Database
        run: bun run check:seed

      - name: 💾 Restore Next.js Cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: 🏗️ Build OpenNext Cloudflare Worker
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: bun run build:worker

      - name: 🛈 Check Cloudflare Worker Bundle Size Limits
        run: bun run check:bundle-size