name: PR Quality Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  storybook-a11y:
    name: ♿ Run Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 💾 Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: 🌐 Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: 🧭 Check Story Completeness
        run: bun run storybook:check:completeness

      - name: 🏗️ Build Storybook App
        run: bun run storybook:build

      - name: ♿ Run Accessibility Checks
        run: bun run storybook:check:browser

      - name: 📩 Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: storybook-a11y-artifacts
          path: |
            storybook-static/
            test-results/
            playwright-report/
          retention-days: 14

  e2e-tests:
    name: 🎭 Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 💾 Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: 🌐 Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox

      - name: 🗄️ Apply Local Migrations
        run: bun run db:migrate:local

      - name: 🌱 Seed Local Database
        run: bun run check:seed

      - name: 🧪 Run Browser Tests
        run: bun run test:e2e

      - name: 📩 Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: ✨ Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🚨 Verify Drizzle Sync
        run: bun run check:drizzle-sync

      - name: 🚨 Verify Cloudflare Types
        run: bun run check:cf-sync

      - name: 🧭 Verify Route Inventory
        run: bun run check:routes

      - name: 🦺 Check Type Safety
        run: bun run check:types

      - name: 📐 Check FSD Architecture
        run: bun run check:architecture

      - name: ✨ Check Code Formatting
        run: bun run check:all

  perf-budgets:
    name: ⚡ Check Performance Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 💾 Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: 🌐 Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: 🗄️ Apply Local Migrations
        run: bun run db:migrate:local

      - name: 🌱 Seed Local Database
        run: bun run check:seed

      - name: 🏗️ Build Web Application
        run: bun run build

      - name: 🚀 Validate Worker Deploy
        run: bun run deploy --dry-run

      - name: 🛈 Check Bundle Size
        run: bun run check:bundle-size

      - name: 🚀 Start Preview Server
        run: |
          bun run build-preview &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Preview server is ready on port 3000"
              break
            fi
            sleep 1
          done

      - name: ⏱️ Run Performance Audit
        env:
          BASE_URL: "http://127.0.0.1:3000"
        run: bun run check:perf-budgets

  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🧪 Run Test Coverage
        run: bun run test:coverage
