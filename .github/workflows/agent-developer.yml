name: AI Agent Developer

on:
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-developer-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-agent-developer:
    name: 💻 Run AI Agent Developer
    if: >
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'dev-needed') || github.event.action == 'assigned')) ||
      (github.event_name == 'issue_comment' && (contains(github.event.issue.labels.*.name, 'dev-needed') || contains(github.event.comment.body, '/dev') || contains(github.event.comment.body, '/implement')) && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: 💾 Cache Bun store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 💻 Execute Agent Developer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bun scripts/agent-developer.ts
