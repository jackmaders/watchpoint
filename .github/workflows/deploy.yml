name: 🚀 Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🏗️ Build Application
        run: bun run build
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: 🗃️ Apply Production Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate:remote

      - name: 🚀 Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

  e2e-tests:
    name: 🎭 Run E2E Tests (${{ matrix.browser }})
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🎭 Run Browser Tests
        uses: ./.github/actions/run-playwright
        with:
          browser: ${{ matrix.browser }}
          base-url: "https://watchpoint.jackmaders.workers.dev/"
          report-name: playwright-report-production-${{ matrix.browser }}

  lighthouse:
    name: 🔦 Run Lighthouse Check
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🔦 Run Lighthouse Check
        uses: ./.github/actions/run-lighthouse
        with:
          base-url: "https://watchpoint.jackmaders.workers.dev/"
          number-of-runs: "3"
          start-server-command: ""
