name: PR Quality Checks

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  e2e-tests:
    name: 🎭 Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun run prisma generate

      - name: 💾 Restore Playwright Browsers Cache
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright Browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: 🏗️ Build Web App
        run: bun run build

      - name: 🧪 Run E2E Tests
        run: bun run test:e2e

      - name: 📩 Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: ✨ Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun run prisma generate

      - name: 🦺 Check Type Safety
        run: bun run check:types

      - name: 📐 Check FSD Architecture
        run: bun run check:architecture

      - name: ✨ Check Linting and Formatting
        run: bun run check:all

  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun run prisma generate

      - name: 🧪 Run Unit Tests with Coverage
        run: bun run test:coverage

  database:
    name: 🛢 Check Database Schema & Migrations
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun run prisma generate

      - name: 🔍 Validate Prisma Schema
        run: bun run prisma:validate

      - name: 🗄️ Verify Cloudflare D1 Migrations
        run: echo y | bun run db:migrate:local

      - name: 🌱 Run Seed Script Check
        run: bun run check:seed




  build:
    name: 🏗️ Build Web App
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun run prisma generate

      - name: 💾 Restore Next.js Cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: 🏗️ Build Web App
        run: bun run build