name: 🤖 PR Agent Review

on:
    pull_request_target:
        types: [opened, reopened, ready_for_review, review_requested]

concurrency:
    group: pr-agent-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    review:
        name: Review pull request
        if: ${{ github.event.sender.type != 'Bot' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            issues: write
            contents: write
            pull-requests: write

        steps:
            - name: Run PR Agent review
              uses: the-pr-agent/pr-agent@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

                  config.model: "gemini/gemini-3.8-flash"
                  config.fallback_models: '["gemini/gemini-3.7-flash","gemini/gemini-3.6-flash","gemini/gemini-3.5-flash"]'
                  pr_reviewer.require_score_review: "true"
                  github_action_config.auto_describe: "true"
                  github_action_config.auto_improve: "true"
