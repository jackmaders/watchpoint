name: Agent Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-mutate-${{ github.event.issue.number }}
  cancel-in-progress: false
  # This group is shared with agent-grill/implement/spec/tickets.yml so agent
  # mutations on the same issue always serialize. Default GH queueing keeps
  # only ONE pending run per group and cancels older pending ones outright —
  # with five workflows racing into this group off the same issue event, the
  # one that should actually run could be the one silently cancelled before
  # it ever starts. `queue: max` keeps every queued run pending (FIFO) instead
  # of dropping any of them.
  queue: max

jobs:
  slot:
    uses: ./.github/workflows/_agent-global-slot.yml
    with:
      number: ${{ github.event.issue.number }}

  dispatch:
    needs: [slot]
    name: 🤖 Dispatch agent command
    # Structural gate only (not a command match) — real command matching is
    # an anchored regex in scripts/agents/dispatch.ts, so it stays testable.
    # Comments carrying the bot marker are filtered here too, to avoid
    # spinning up a job for every agent-authored reply: the PAT used to chain
    # workflows makes those comments look human-authored (spec §5.8).
    if: >
      github.event.issue.pull_request == null &&
      !contains(github.event.comment.body, '<!-- bot-comment -->')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.slot.outputs.group }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: 🤖 Setup Codex
        uses: ./.github/actions/setup-codex
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}

      - name: 🤖 Dispatch command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.6-luna' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          # GitHub-hosted runners are already isolated; avoid Codex's nested bwrap sandbox.
          AGENT_CODEX_BYPASS_SANDBOX: "1"
          AGENT_RUN_TIMEOUT_MS: "720000"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: bun scripts/agents/dispatch.ts
