name: Agent Spec

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-mutate-${{ github.event.issue.number }}
  cancel-in-progress: false
  # See agent-dispatch.yml — this group is shared across all agent-mutate-*
  # workflows so mutations on the same issue serialize. Without `queue: max`,
  # GH keeps only one pending run per group and cancels older pending ones,
  # so the run whose job `if` actually matches this event isn't guaranteed
  # to survive the race against the other workflows sharing the group.
  queue: max

jobs:
  slot:
    uses: ./.github/workflows/_agent-global-slot.yml
    with:
      number: ${{ github.event.issue.number }}

  spec:
    needs: [slot]
    name: 📜 Publish spec
    if: github.event.label.name == 'spec:needed'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.slot.outputs.group }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v5

      - name: 🤖 Setup Codex
        uses: ./.github/actions/setup-codex
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}

      - name: 📜 Publish spec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.6-luna' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          # GitHub-hosted runners are already isolated; avoid Codex's nested bwrap sandbox.
          AGENT_CODEX_BYPASS_SANDBOX: "1"
          AGENT_RUN_TIMEOUT_MS: "720000"
          # `AGENT_PAT` is what lets spec.ts chain into tickets:needed — a
          # label applied with the default GITHUB_TOKEN above cannot fire
          # agent-tickets.yml (spec §5.8). spec.ts itself falls back to a
          # comment when this secret isn't configured.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun scripts/agents/spec.ts

      # spec.ts handles its own agent:blocked labeling and error comment on a
      # classified failure (matching grill.ts's pattern) and always removes
      # agent:in-progress itself in a `finally`. This step is only a backstop
      # for the run's Bun process dying outright — OOM, a runner timeout —
      # before that cleanup code ever gets to run.
      - name: 🧹 Remove agent:in-progress (backstop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "agent:in-progress" || true
