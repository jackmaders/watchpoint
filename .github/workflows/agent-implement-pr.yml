name: Agent Implement PR

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-mutate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  handoff-untrusted:
    name: 🧑‍⚖️ Escalate untrusted PR
    if: >
      github.event.label.name == 'dev:needed' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧑‍⚖️ Hand off to a human
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label "review:escalated"
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --remove-label "dev:needed" || true
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --remove-label "review:needed" || true
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body '<!-- bot-comment -->
          🚦 This PR is from an untrusted author, so automated PR mutation is disabled. A human must review it.'

  implement-pr:
    name: 🛠️ Fix reviewed pull request
    if: >
      github.event.label.name == 'dev:needed' &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🛒 Checkout PR head
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 🤖 Setup Codex
        uses: ./.github/actions/setup-codex
        with:
          agent-api-key: ${{ secrets.AGENT_API_KEY }}

      - name: 🛠️ Fix review findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.6-luna' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          AGENT_CODEX_BYPASS_SANDBOX: "1"
          AGENT_RUN_TIMEOUT_MS: "1620000"
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun scripts/agents/implement-pr.ts

      - name: 🧹 Remove agent:in-progress (backstop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "agent:in-progress" || true
