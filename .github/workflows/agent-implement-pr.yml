name: Agent Implement PR

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-mutate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  implement-pr:
    name: 🛠️ Fix reviewed pull request
    if: github.event.label.name == 'dev:needed'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🛒 Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: 💾 Cache Bun store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 🌐 Install Codex CLI
        run: bun add -g @openai/codex

      - name: 🔐 Authenticate Codex
        env:
          OPENAI_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: 🔧 Configure git identity
        run: |
          git config --global user.name "watchpoint-agent[bot]"
          git config --global user.email "watchpoint-agent[bot]@users.noreply.github.com"

      - name: 🛠️ Fix review findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.6-luna' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          AGENT_CODEX_BYPASS_SANDBOX: "1"
          AGENT_RUN_TIMEOUT_MS: "1620000"
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun scripts/agents/implement-pr.ts

      - name: 🧹 Remove agent:in-progress (backstop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "agent:in-progress" || true
