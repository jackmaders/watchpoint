name: "Run Lighthouse CI"
description: "Installs Chromium, runs Lighthouse CI against the production preview, and uploads reports"

runs:
  using: "composite"
  steps:
    - name: 🌐 Setup Chromium
      uses: ./.github/actions/setup-browser
      with:
        browsers: chromium

    - name: 🔎 Resolve Lighthouse Chrome
      shell: bash
      run: |
        chrome_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
        echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

    - name: 🔦 Run Lighthouse CI
      shell: bash
      run: bun run test:lighthouse

    - name: 📊 Upload Lighthouse Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: lighthouse-report
        path: .lighthouseci/
        if-no-files-found: warn
        retention-days: 7
