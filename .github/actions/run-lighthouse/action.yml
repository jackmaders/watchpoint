name: "Run Lighthouse CI"
description: "Installs Chromium, runs Lighthouse CI, and uploads reports"

inputs:
  base-url:
    description: "Optional URL for Lighthouse to audit instead of the local production preview"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: 💾 Cache Lighthouse Chrome
      id: chrome-cache
      uses: actions/cache@v5
      with:
        key: ${{ runner.os }}-lighthouse-chrome-${{ hashFiles('**/bun.lock') }}
        path: ~/.cache/ms-playwright
        restore-keys: |
          ${{ runner.os }}-lighthouse-chrome-

    - name: 🧩 Install Chrome System Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: bunx playwright install-deps chromium

    - name: 🌐 Install Chrome for Lighthouse
      if: steps.chrome-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install chromium

    - name: 🔎 Resolve Lighthouse Chrome
      shell: bash
      run: |
        chrome_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
        echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

    - name: 🔦 Run Lighthouse CI
      shell: bash
      env:
        LIGHTHOUSE_BASE_URL: ${{ inputs.base-url }}
      run: |
        if [[ -n "$LIGHTHOUSE_BASE_URL" ]]; then
          bun run test:lighthouse -- \
            --collect.url="$LIGHTHOUSE_BASE_URL" \
            --collect.startServerCommand=""
        else
          bun run test:lighthouse
        fi

    - name: 📊 Upload Lighthouse Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: lighthouse-report
        path: .lighthouseci/
        if-no-files-found: warn
        retention-days: 7
