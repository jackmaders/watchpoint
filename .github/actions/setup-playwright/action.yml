name: "Setup Playwright"
description: "Caches and installs Playwright browser binaries and operating system dependencies"

inputs:
  browsers:
    default: "chromium"
    description: "Space-separated list of browsers to install (e.g. 'chromium' or 'chromium firefox')"
    required: false

runs:
  using: "composite"
  steps:
    - name: 💾 Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        key: ${{ runner.os }}-playwright-${{ inputs.browsers }}-${{ hashFiles('**/bun.lock') }}
        path: ~/.cache/ms-playwright
        restore-keys: |
          ${{ runner.os }}-playwright-${{ inputs.browsers }}-
          ${{ runner.os }}-playwright-

    - name: 🧩 Install Browser System Dependencies
      if: runner.os == 'Linux'
      run: bunx playwright install-deps ${{ inputs.browsers }}
      shell: bash

    - name: 🌐 Install Browser Binaries
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: bunx playwright install ${{ inputs.browsers }}
      shell: bash

    - name: 🔎 Resolve Lighthouse Chrome
      shell: bash
      run: |
        chrome_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
        echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
